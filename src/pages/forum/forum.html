<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wireframe - Forum</title>

    <link rel="stylesheet" href="../../common/global.css">
    <link rel="stylesheet" href="../../common/components.css">
    <link rel="stylesheet" href="forum.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <img
                class="logo"
                src="../../assets/logo.png"
                alt="Logo Reforço Comunitário"
            >

            <div class="search-bar">
                <input type="text" placeholder="Pesquise aqui...">
            </div>

            <nav class="navigation">
                <button class="navigation-button" value="initial" style="margin-left: 50px;">Início</button>
                <button class="navigation-button" value="topics">Tópicos</button>
                <button class="navigation-button" value="tutors">Tutores</button>
            </nav>
        </header>

        <main class="content">
            <article class="banner">
                <section class="banner-greeting">
                    <h1>Bem-vindo(a) ao Reforço Comunitário!</h1>
                    <p>Tire dúvidas, compartilhe conhecimento e encontre
                        pessoas dispostas a te ajudar nos seus estudos.
                    </p>
                </section>
            </article>

            <section class="actions">
                <button class="ask-question-button">Fazer pergunta</button>
                <button class="filter-button">Filtrar por tópico</button>
                <div class="search-forum">
                    <input type="text" placeholder="Pesquisar no fórum...">
                </div>
            </section>


            <script src="forum.js"></script>
        </main>
    </div>
</body>
