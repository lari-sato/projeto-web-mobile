<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wireframe - Tutores</title>

    <link rel="stylesheet" href="../../common/global.css">
    <link rel="stylesheet" href="../../common/components.css">
    <link rel="stylesheet" href="tutors.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <img
                class="logo"
                src="../../assets/logo.png"
                alt="Logo Reforço Comunitário"
            >
            <div class="search-bar">
                <input type="text" placeholder="Pesquise aqui...">
            </div>
        </header>

        <main class="content">
            <h1 class="title">Boa!</h1>
            <p class="subtitle">
                Agora, selecione um tutor para expandir seu perfil.
            </p>

            <nav class="pagination" aria-label="Paginação de tutores">
                <button class="pagination-arrow">
                    <img src="../../assets/arrow-left.svg" alt="Página anterior">
                </button>

                <span class="pagination-current">1 / 30</span>

                <button class="pagination-arrow">
                    <img src="../../assets/arrow-right.svg" alt="Próxima página">
                </button>
            </nav>

            <div class="back-container">
                <a href="../topics/topics.html" class="btn-submit">Voltar</a>
            </div>

        </main>

    <script src="tutors.js"></script>
