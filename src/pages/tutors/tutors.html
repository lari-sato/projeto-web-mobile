<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wireframe - Tutores</title>

    <link rel="stylesheet" href="../../common/global.css">
    <link rel="stylesheet" href="../../common/components.css">
    <link rel="stylesheet" href="tutors.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <img
                class="logo"
                src="../../assets/logo.png"
                alt="Logo Reforço Comunitário"
            >

            <div class="search-bar">
                <input type="text" placeholder="Pesquise aqui...">
            </div>

            <nav class="navigation">
                <button class="navigation-button" value="initial">
                    <img class="navigation-icon" src="../../assets/initial.png" alt="Ícone de Início">
                    Início
                </button>
                <button class="navigation-button" value="topics">
                    <img class="navigation-icon" src="../../assets/topics.png" alt="Ícone de Tópicos">
                    Tópicos
                </button>
                <button class="navigation-button active" value="tutors">
                    <img class="navigation-icon" src="../../assets/tutors.png" alt="Ícone de Tutores">
                    Tutores
                </button>
            </nav>
        </header>

        <main class="content">
            <h1 class="title">Tutores disponíveis</h1>
            <p class="subtitle">
                Encontre um tutor para tirar dúvidas, aprofundar seus estudos
                ou receber orientação.
            </p>

            <nav class="pagination" aria-label="Paginação de tutores">

                <button
                    type="button"
                    class="pagination-arrow"
                    id="prev-page"
                >
                    <img
                        src="../../assets/arrow-left.svg"
                        alt="Página anterior"
                    >
                </button>

                <span class="pagination-current">1 / 1</span>

                <button
                    type="button"
                    class="pagination-arrow"
                    id="next-page"
                >
                    <img
                        src="../../assets/arrow-right.svg"
                        alt="Próxima página"
                    >
                </button>

            </nav>

            <div class="back-container">
                <a href="../topics/topics.html" class="btn-submit">
                    Voltar
                </a>
            </div>

        </main>

    </div>

    <script src="tutors.js"></script>

</body>
</html>
