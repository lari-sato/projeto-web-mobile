<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wireframe - Tópicos</title>

    <link rel="stylesheet" href="../../common/global.css">
    <link rel="stylesheet" href="../../common/components.css">
    <link rel="stylesheet" href="topics.css">
</head>

<body>

    <div class="container">
        <header class="header">
            <img
                class="logo"
                src="../../assets/logo.png"
                alt="Logo Reforço Comunitário"
            >

            <div class="search-bar">
                <input type="text" placeholder="Pesquise aqui...">
            </div>

            <nav class="navigation">
                <button class="navigation-button" value="initial">
                    <img class="navigation-icon" src="../../assets/initial.png" alt="Ícone de Início">
                    Início
                </button>
                <button class="navigation-button active" value="topics">
                    <img class="navigation-icon" src="../../assets/topics.png" alt="Ícone de Tópicos">
                    Tópicos
                </button>
                <button class="navigation-button" value="tutors">
                    <img class="navigation-icon" src="../../assets/tutors.png" alt="Ícone de Tutores">
                    Tutores
                </button>
            </nav>
        </header>

        <main class="content">
            <h1 class="title">Explorar tópicos</h1>
            <p class="subtitle">
                Encontre um tema de interesse para ver conteúdos, discussões
                e tutores relacionados.
            </p>

            <div class="button-container">
                <button type="submit" class="btn-submit" disabled>Buscar Tutores</button>
            </div>
        </main>
    </div>

    <script src="topics.js"></script>

</body>

</html>
