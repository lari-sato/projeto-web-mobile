<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wireframe - Tópicos</title>

    <link rel="stylesheet" href="../../common/global.css">
    <link rel="stylesheet" href="../../common/components.css">
    <link rel="stylesheet" href="topics.css">
</head>


<body>
    <div class="container">
        <header class="header">
            <img
                class="logo"
                src="../../assets/logo0.svg"
                alt="Logo Reforço Comunitário"
            >
            <div class="search-bar">
                <input type="text" placeholder="Pesquise aqui...">
            </div>
        </header>

        <main class="content">
            <h1 class="title">Bem-Vindo(a)!</h1>
            <p class="subtitle">
                Selecione um tópico para começar.
            </p>
                       
            <script>
                const topics = ['Matemática', 'Português', 'Redação', 'História', 'Geografia', 'Inglês', 'Física', 'Química', 'Biologia', 'Artes', 'Educação Física', 'Filosofia'];

                const grid = document.createElement('section')
                grid.classList.add('topics-grid');

                topics.forEach((topic) => {
                    const newTopic = document.createElement('article');
                    newTopic.classList.add('topic-card');

                    const newLabel = document.createElement('label');
                    const newCheckbox = document.createElement('input');
                    
                    newCheckbox.type = 'checkbox';
                    newCheckbox.name = topic;
                    newCheckbox.classList.add('topic-checkbox');

                    const textNode = document.createTextNode(topic);
                    
                    const imagePlaceholder = document.createElement('div');
                    imagePlaceholder.classList.add('image-placeholder');

                    newLabel.appendChild(newCheckbox);
                    newLabel.appendChild(imagePlaceholder);
                    newLabel.appendChild(textNode);

                    newTopic.appendChild(newLabel);

                    grid.appendChild(newTopic);
                });

                document.body.appendChild(grid);
            </script>
                
            <div class="button-container">
              <button class="btn-submit">Buscar Tutores</button>
            </div>

        </main>
    </div>
</body>
</html>
