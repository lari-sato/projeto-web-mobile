<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wireframe - Login</title>

  <link rel="stylesheet" href="../../common/global.css">
    <link rel="stylesheet" href="../../common/components.css">
  <link rel="stylesheet" href="../../common/auth.css">
</head>

<body>
    <div class="container">
    <header class="header"></header>

    <main class="content">
      <h1 class="title">Login</h1>
      <p class="subtitle">Ainda não possui uma conta? <a href="#">Registre-se.</a></p>

      <form class="form">
        <div class="form-group">
          <label for="usuario">USUÁRIO OU E-MAIL</label>
          <input type="text" id="usuario" name="usuario" required>
        </div>

        <div class="form-group">
          <label for="senha">SENHA</label>
          <input type="password" id="senha" name="senha" required>
        </div>

        <button type="submit" class="btn-submit" disabled>OK</button>
        
      </form>
    </main>
  </div>

    <script src="login.js"></script>
    
</body>
</html>
